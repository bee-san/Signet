name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  UV_MANAGED_PYTHON: "true"
  UV_PYTHON: "3.12.13"
  UV_VERSION: "0.11.28"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Gate exact tagged main source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the complete tagged history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false
          version: "0.11.28"
      - name: Install pinned managed Python
        run: uv python install 3.12.13
      - name: Verify immutable tag, project, repository, and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          uv lock --check
          uv run --frozen --group release python scripts/release_gate.py verify-ref \
            --tag "$GITHUB_REF_NAME" --sha "$GITHUB_SHA" \
            --event-name "$GITHUB_EVENT_NAME" --ref-type "$GITHUB_REF_TYPE" \
            --repository "$GITHUB_REPOSITORY" --main-ref refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Require successful exact-commit main CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 75); do
            latest="$(
              gh api --method GET \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
                -f head_sha="$GITHUB_SHA" -f event=push -f per_page=20 \
                --jq "[.workflow_runs[] | select(.head_sha == \"$GITHUB_SHA\" and .head_branch == \"main\" and .event == \"push\")] | sort_by(.run_number) | last | if . == null then \"missing\" else (.status + \":\" + (.conclusion // \"pending\")) end"
            )"
            case "$latest" in
              completed:success) exit 0 ;;
              completed:*)
                echo "exact-commit main CI is not successful: $latest" >&2
                exit 1
                ;;
            esac
            sleep 20
          done
          echo "exact-commit main CI did not complete successfully" >&2
          exit 1

  source:
    name: Rebuild, scan, and inventory source
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false
          version: "0.11.28"
      - name: Install pinned managed Python
        run: uv python install 3.12.13
      - name: Install locked release environment
        run: uv sync --frozen --group release
      - name: Verify Python and SQLite release baseline
        run: >-
          uv run --frozen --group release python -c 'import sqlite3, sys;
          assert sys.version_info[:3] == (3, 12, 13), sys.version;
          assert tuple(map(int, sqlite3.sqlite_version.split("."))) >= (3, 51, 3),
          sqlite3.sqlite_version'
      - name: Build source distribution twice
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          uv run --frozen --group release python scripts/reproducible_build.py \
            --kind sdist --source . --output-directory dist \
            --evidence dist/source.build.json --source-sha "$GITHUB_SHA" \
            --platform source
      - name: Check source metadata
        run: uv run --frozen --group release twine check --strict dist/*.tar.gz
      - name: Scan source
        run: >-
          uv run --frozen --group release bandit -r src/signet deploy scripts
          -ll
      - name: Audit locked runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv export --quiet --frozen --no-dev --no-emit-project \
            --format requirements-txt --output-file "$RUNNER_TEMP/runtime.txt"
          uv run --frozen --group release pip-audit \
            -r "$RUNNER_TEMP/runtime.txt" --strict --disable-pip --require-hashes
      - name: Install exact runtime for SBOM and license inventory
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/signet-runtime"
          uv venv --python 3.12.13 "$runtime"
          uv pip install --python "$runtime/bin/python" --require-hashes \
            -r "$RUNNER_TEMP/runtime.txt"
          uv pip install --python "$runtime/bin/python" --no-deps dist/*.tar.gz
          "$runtime/bin/python" scripts/runtime_manifest.py \
            --source-sha "$GITHUB_SHA" \
            --output dist/signet-gateway.runtime.json
          uv run --frozen --group release cyclonedx-py environment \
            "$runtime/bin/python" --pyproject pyproject.toml \
            --mc-type application --output-reproducible --spec-version 1.6 \
            --output-format JSON --output-file dist/signet-gateway.cdx.json
          uv run --frozen --group release pip-licenses \
            --python "$runtime/bin/python" --format=json --with-urls \
            --output-file dist/signet-gateway.licenses.json
      - name: Verify source, evidence, SBOM, and license closure
        run: >-
          uv run --frozen --group release python scripts/release_gate.py
          verify-artifacts --directory dist --source-sha "$GITHUB_SHA"
          --expect-sdist --require-evidence --require-sbom
          --require-license-report
      - name: Upload reviewed source artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-release
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  wheel:
    name: Rebuild and smoke ${{ matrix.platform }} wheel
    needs: [gate, source]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-x86-64
            gate-platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-arm64
            gate-platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            gate-platform: macos-arm64
            runner: macos-15
    steps:
      - name: Check out exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download reviewed source distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-release
          path: source-release
      - name: Install pinned uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false
          version: "0.11.28"
      - name: Install pinned managed Python
        run: uv python install 3.12.13
      - name: Install locked test environment
        run: uv sync --frozen --group release
      - name: Run package and installed-wheel regressions
        run: >-
          uv run --frozen --group release pytest -q
          tests/test_release_pipeline.py tests/test_setup_wheel_e2e.py
      - name: Rebuild wheel twice from reviewed sdist
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          sdist="$(find source-release -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$sdist"
          uv run --frozen --group release python scripts/reproducible_build.py \
            --kind wheel --source "$sdist" \
            --source-evidence source-release/source.build.json \
            --output-directory dist \
            --evidence "dist/${{ matrix.platform }}.build.json" \
            --source-sha "$GITHUB_SHA" --platform "${{ matrix.platform }}"
      - name: Verify native wheel contents and evidence
        run: >-
          uv run --frozen --group release python scripts/release_gate.py
          verify-artifacts --directory dist --source-sha "$GITHUB_SHA"
          --platform "${{ matrix.gate-platform }}" --require-evidence
      - name: Install wheel from the hashed runtime closure
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/signet-wheel"
          uv export --quiet --frozen --no-dev --no-emit-project \
            --format requirements-txt --output-file "$RUNNER_TEMP/runtime.txt"
          uv venv --python 3.12.13 "$runtime"
          uv pip install --python "$runtime/bin/python" --require-hashes \
            -r "$RUNNER_TEMP/runtime.txt"
          uv pip install --python "$runtime/bin/python" --no-deps dist/*.whl
          test "$("$runtime/bin/signet" --version)" = "signet ${GITHUB_REF_NAME#v}"
          "$runtime/bin/signet" --help >/dev/null
          "$runtime/bin/signet" setup --help >/dev/null
          "$runtime/bin/signet" doctor --help >/dev/null
          "$runtime/bin/signet" status --help >/dev/null
      - name: Upload reviewed native wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  verify-release:
    name: Sign, attest, and verify exact release set
    needs: [source, wheel]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download current-run release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{source-release,wheel-*}"
          path: dist
          merge-multiple: true
      - name: Install pinned uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false
          version: "0.11.28"
      - name: Install pinned managed Python
        run: uv python install 3.12.13
      - name: Install locked release verification tools
        run: uv sync --frozen --group release
      - name: Verify exact aggregate artifact set
        run: >-
          uv run --frozen --group release python scripts/release_gate.py
          verify-artifacts --directory dist --source-sha "$GITHUB_SHA"
          --platform linux-x86_64 --platform linux-aarch64
          --platform macos-arm64 --expect-sdist --require-evidence
          --require-sbom --require-license-report
      - name: Generate and verify exact checksums
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen --group release python scripts/release_gate.py \
            write-checksums --directory dist
          uv run --frozen --group release python scripts/release_gate.py \
            verify-checksums --directory dist
      - name: Sign and verify release artifacts
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 # v3.4.0
        with:
          inputs: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.build.json
            dist/*.cdx.json
            dist/*.licenses.json
            dist/*.runtime.json
            dist/SHA256SUMS
          release-signing-artifacts: false
          verify: true
          verify-cert-identity: >-
            https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
      - name: Attest build provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Attest runtime SBOM
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: dist/signet-gateway.cdx.json
      - name: Verify GitHub attestations and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for artifact in dist/*.whl dist/*.tar.gz; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" \
              --predicate-type https://cyclonedx.org/bom \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"
          done
          uv run --frozen --group release python scripts/release_gate.py \
            verify-checksums --directory dist
      - name: Upload signed verified release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish approved trusted release
    needs: verify-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/p/signet-gateway
    permissions:
      actions: read
      attestations: read
      contents: write
      id-token: write
    steps:
      - name: Check out exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download only the current-run verified release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release
          path: dist
      - name: Install pinned uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false
          version: "0.11.28"
      - name: Install pinned managed Python
        run: uv python install 3.12.13
      - name: Install locked release verification tools
        run: uv sync --frozen --group release
      - name: Reverify approved release identity and artifacts
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen --group release python scripts/release_gate.py \
            verify-artifacts --directory dist --source-sha "$GITHUB_SHA" \
            --platform linux-x86_64 --platform linux-aarch64 \
            --platform macos-arm64 --expect-sdist --require-evidence \
            --require-sbom --require-license-report --require-signatures
          uv run --frozen --group release python scripts/release_gate.py \
            verify-checksums --directory dist
          for artifact in \
            dist/*.whl dist/*.tar.gz dist/*.build.json dist/*.cdx.json \
            dist/*.licenses.json dist/*.runtime.json dist/SHA256SUMS; do
            uv run --frozen --group release sigstore verify identity \
              --bundle "${artifact}.sigstore.json" \
              --cert-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              "$artifact"
          done
      - name: Reverify GitHub attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for artifact in dist/*.whl dist/*.tar.gz; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" \
              --predicate-type https://cyclonedx.org/bom \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"
          done
      - name: Publish distributions with PyPI trusted publishing
        run: >-
          uv publish --trusted-publishing always dist/*.whl dist/*.tar.gz
      - name: Publish immutable GitHub release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag
          --title "Signet ${GITHUB_REF_NAME}" --notes-file CHANGELOG.md